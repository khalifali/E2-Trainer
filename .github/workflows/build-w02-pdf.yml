name: Build W02 PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_w02_pdf.py'
      - '.github/workflows/build-w02-pdf.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install ReportLab
        run: python3 -m pip install --user reportlab
      - name: Build PDF
        run: python3 scripts/build_w02_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Saison_2026-2027/Trainingswochen/W02_2026-09-21/E-Jugend_Trainingsplan_Woche_2.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Update Thursday W02 training PDF"
          git push
